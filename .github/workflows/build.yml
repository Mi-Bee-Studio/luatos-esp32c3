name: Build Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  TARGET: esp32c3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0
    strategy:
      fail-fast: false
      matrix:
        project: [wifi-csi-sensing, blackbox]
    steps:
      - uses: actions/checkout@v4

      - name: Build Firmware (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: |
          . ${IDF_PATH}/export.sh
          idf.py set-target $TARGET
          idf.py build

      - name: Prepare Artifacts
        working-directory: ${{ matrix.project }}
        run: |
          mkdir -p ../firmware
          cp build/bootloader/bootloader.bin ../firmware/${{ matrix.project }}_bootloader.bin
          cp build/partition_table/partition-table.bin ../firmware/${{ matrix.project }}_partition_table.bin
          # 排除 bootloader/partition/ota_data_initial（OTA 双槽布局新生成物）
          APP_BIN=$(ls build/*.bin | grep -v -e bootloader -e partition -e ota_data | head -1)
          cp "$APP_BIN" ../firmware/${{ matrix.project }}_firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project }}
          path: firmware/
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware/

      # Both projects: single app slot, app @0x10000 (no OTA partition on this board)
      - name: Create Flash Scripts
        run: |
          cat > flash_wifi-csi-sensing.sh << 'SCRIPT'
          #!/bin/bash
          # wifi-csi-sensing (Luatos ESP32-C3 board) flash script
          # Usage: ./flash_wifi-csi-sensing.sh /dev/ttyACM0
          PORT=${1:-/dev/ttyACM0}
          echo "Flashing wifi-csi-sensing firmware to $PORT..."
          esptool.py --chip esp32c3 -p "$PORT" -b 460800 --before default_reset --after hard_reset write_flash \
            0x0 firmware/wifi-csi-sensing_bootloader.bin \
            0x8000 firmware/wifi-csi-sensing_partition_table.bin \
            0x10000 firmware/wifi-csi-sensing_firmware.bin
          echo "Done! Reset the device to start."
          SCRIPT
          chmod +x flash_wifi-csi-sensing.sh

          cat > flash_blackbox.sh << 'SCRIPT'
          #!/bin/bash
          # blackbox (Luatos ESP32-C3 board) flash script
          # Usage: ./flash_blackbox.sh /dev/ttyACM0
          PORT=${1:-/dev/ttyACM0}
          echo "Flashing blackbox firmware to $PORT..."
          esptool.py --chip esp32c3 -p "$PORT" -b 460800 --before default_reset --after hard_reset write_flash \
            0x0 firmware/blackbox_bootloader.bin \
            0x8000 firmware/blackbox_partition_table.bin \
            0x10000 firmware/blackbox_firmware.bin
          echo "Done! Reset the device to start."
          SCRIPT
          chmod +x flash_blackbox.sh

          cat > flash_wifi-csi-sensing.bat << 'SCRIPT'
          @echo off
          set PORT=%1
          if "%PORT%"=="" set PORT=COM3
          echo Flashing wifi-csi-sensing firmware to %PORT%...
          esptool.py --chip esp32c3 -p %PORT% -b 460800 --before default_reset --after hard_reset write_flash 0x0 firmware\wifi-csi-sensing_bootloader.bin 0x8000 firmware\wifi-csi-sensing_partition_table.bin 0x10000 firmware\wifi-csi-sensing_firmware.bin
          echo Done! Reset the device to start.
          SCRIPT

          cat > flash_blackbox.bat << 'SCRIPT'
          @echo off
          set PORT=%1
          if "%PORT%"=="" set PORT=COM3
          echo Flashing blackbox firmware to %PORT%...
          esptool.py --chip esp32c3 -p %PORT% -b 460800 --before default_reset --after hard_reset write_flash 0x0 firmware\blackbox_bootloader.bin 0x8000 firmware\blackbox_partition_table.bin 0x10000 firmware\blackbox_firmware.bin
          echo Done! Reset the device to start.
          SCRIPT

      - name: Generate Checksums
        run: |
          cd firmware
          sha256sum *.bin > ../checksums.txt

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1 2>/dev/null || echo "")
          CURRENT_TAG="${{ github.ref_name }}"

          cat > RELEASE_NOTES.md << EOF
          # Luatos ESP32-C3 Board Firmware ${CURRENT_TAG}

          ---

          ## What's Changed

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "" >> RELEASE_NOTES.md
            echo '```' >> RELEASE_NOTES.md
            git log --oneline --no-decorate ${PREV_TAG}..HEAD >> RELEASE_NOTES.md
            echo '```' >> RELEASE_NOTES.md
          else
            echo "Initial release." >> RELEASE_NOTES.md
          fi

          cat >> RELEASE_NOTES.md << 'EOF'
          ## Flash Instructions

          Each sub-project ships its own firmware — flash the one you want
          (they are alternative firmwares for the same board):

          1. Download the files for your project from this release
          2. **Linux/Mac**: `chmod +x flash_<project>.sh && ./flash_<project>.sh /dev/ttyACM0`
          3. **Windows**: `flash_<project>.bat COM3` (replace COM3 with your port)
          4. Or use ESP-IDF v6.0: `idf.py -p COMx flash`

          > Both firmwares support on-board web OTA (:80, invalid images never
          > switch slots). First flash — or switching between the two
          > firmwares — must include bootloader + partition table + app
          > (the scripts do all three); partition layouts differ between
          > the two projects.

          ## Files

          | File | Description |
          |------|-------------|
          | wifi-csi-sensing_firmware.bin / blackbox_firmware.bin | Main firmware per project |
          | *_bootloader.bin | ESP32-C3 bootloader |
          | *_partition_table.bin | Partition table (per project) |
          | flash_*.sh / flash_*.bat | Flash scripts (project × Linux/Mac + Windows) |
          | checksums.txt | SHA256 checksums |

          ## First-time Setup

          - **wifi-csi-sensing**: see its README / user guide (docs/user-guide.md).
          - **blackbox**: connect to the SoftAP `blackbox-c3` / `12345678`
            → 192.168.4.1 to provision WiFi, then configure probes in the
            dashboard (:80) and scrape metrics on :9090.
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="firmware/wifi-csi-sensing_bootloader.bin \
            firmware/wifi-csi-sensing_partition_table.bin \
            firmware/wifi-csi-sensing_firmware.bin \
            firmware/blackbox_bootloader.bin \
            firmware/blackbox_partition_table.bin \
            firmware/blackbox_firmware.bin \
            flash_wifi-csi-sensing.sh \
            flash_wifi-csi-sensing.bat \
            flash_blackbox.sh \
            flash_blackbox.bat \
            checksums.txt"
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists — uploading/clobbering assets"
            gh release upload ${{ github.ref_name }} $ASSETS --clobber
          else
            gh release create ${{ github.ref_name }} \
              $ASSETS \
              --title "Luatos ESP32-C3 Board Firmware ${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          fi
